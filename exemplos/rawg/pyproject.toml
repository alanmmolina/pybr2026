[project]
name = "rawg-dlt"
version = "0.1.0"
description = "Exemplo da palestra Python Brasil 2026: ingestão da RAWG com dlt para DuckDB ou Data Lake Parquet"
requires-python = ">=3.14"
dependencies = [
    "click>=8",
    "dlt[duckdb,parquet]>=1.30,<2",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "taskipy>=1.14.1",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"

[tool.taskipy.tasks]
check = "ruff check . && ruff format --check . && ty check ."
format = "ruff format ."
demo = "python rawg.py"
lake = "python rawg.py filesystem"
clean = "rm -rf rawg.duckdb datalake __pycache__ ~/.dlt/pipelines/rawg"
