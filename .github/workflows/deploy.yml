name: Deploy slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # o deck é HTML estático e autocontido — não há build.
      # composition/ vira a raiz do site do projeto (URL curta, sem /composition)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/composition

      - id: deployment
        uses: actions/deploy-pages@v4
