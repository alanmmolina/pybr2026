name: Deploy slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Não há build, mas há montagem: o que se publica é o presenter do
      # HyperFrames (presenter/index.html + player.js + slideshow.js) com a
      # composition embaixo dele. Publicar composition/ sozinho servia a ilha
      # do slideshow sem o chrome — sem fullscreen, sem next/previous.
      - run: |
          mkdir -p _site
          cp -r slides/presenter/. _site/
          cp -r slides/composition _site/composition

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
