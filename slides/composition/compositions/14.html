  <script>
function fireResource() {
  var scene = document.getElementById("scene-resource");
  if (!scene) return;
  var notes = scene.querySelectorAll(".res-note");
  var rnotes = scene.querySelectorAll(".res-note-r");

  var tl = gsap.timeline();
  gsap.set(notes, { opacity: 0, x: -12 });
  gsap.set(rnotes, { opacity: 0, x: 12 });
  tl.to(notes, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.12, overwrite: "auto" }, 0.2);
  tl.to(rnotes, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.12, overwrite: "auto" }, 0.2);
}
