<span class="syn-kw">import</span> requests

<span class="syn-kw">while</span> <span class="syn-kw">True</span>:

<pre><span class="syn-kw">import</span> requests

<span class="syn-kw">def</span> <span class="syn-fn">page</span><span class="syn-brk">(</span><span class="syn-param">url</span>,<span class="syn-param">skip</span><span class="syn-brk">)</span>:

<span class="syn-kw">class</span> Store:

<pre><span class="syn-kw">import</span> asyncio
<span class="syn-kw">import</span> httpx

<span class="syn-kw">async</span> <span class="syn-kw">def</span> <span class="syn-fn">fetch</span><span class="syn-brk">(</span><span class="syn-param">client</span>,<span class="syn-param">url</span><span class="syn-brk">)</span>:

    <span class="syn-kw">return</span> response.<span class="syn-fn">json</span><span class="syn-brk">(</span><span class="syn-brk">)</span>

<span class="syn-kw">async</span> <span class="syn-kw">def</span> <span class="syn-fn">all_pages</span><span class="syn-brk">(</span>client, urls<span class="syn-brk">)</span>:
