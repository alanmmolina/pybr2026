<template>
  <div data-composition-id="pessoal" data-width="1920" data-height="1080" data-duration="10" style="position:absolute; inset:0; overflow:hidden; background:#0F0F0F;">
    <div class="slide-inner">
      <h1 class="headline cmd-title" data-anim=""><span class="cmd-chip">whoami</span></h1>
      <div class="pf-strip">
        <div class="pf-item" style="transform: rotate(-1.6deg);">
          <svg class="pf-frame" viewBox="0 0 302 374" aria-hidden="true"><path class="pf-border" /></svg>
          <img class="pf-photo" src="vendor/photos/parceira.jpg" alt="">
          <div class="pf-cap">Ingrid</div>
        </div>
        <div class="pf-item" style="transform: rotate(1.3deg);">
          <svg class="pf-frame" viewBox="0 0 302 374" aria-hidden="true"><path class="pf-border" /></svg>
          <img class="pf-photo" src="vendor/photos/maggie.jpg" alt="">
          <div class="pf-cap">Maggie</div>
        </div>
        <div class="pf-item" style="transform: rotate(-1deg);">
          <svg class="pf-frame" viewBox="0 0 302 374" aria-hidden="true"><path class="pf-border" /></svg>
          <img class="pf-photo" src="vendor/photos/escritorio.jpg" alt="">
        </div>
        <div class="pf-item" style="transform: rotate(1.8deg);">
          <svg class="pf-frame" viewBox="0 0 302 374" aria-hidden="true"><path class="pf-border" /></svg>
          <img class="pf-photo" src="vendor/photos/oficina.jpg" alt="">
        </div>
        <div class="pf-item" style="transform: rotate(-0.8deg);">
          <svg class="pf-frame" viewBox="0 0 302 374" aria-hidden="true"><path class="pf-border" /></svg>
          <img class="pf-photo" src="vendor/photos/impressora-3d.jpg" alt="">
        </div>
        <div class="pf-cap pf-group"><span>escritório</span><span>oficina</span><span>impressão 3D</span></div>
      </div>
    </div>
  </div>
  <script>
    var pessoalPrepped = false;
function firePessoalTimeline() {
  var items = document.querySelectorAll(".pf-item");
  if (!items.length) return;
  var tl = gsap.timeline();
  var words = document.querySelectorAll(".pf-group > span");
  var shared = 0;
  for (var i = 0; i < items.length; i++) {
    var border = items[i].querySelector(".pf-border");
    var photo = items[i].querySelector(".pf-photo");
    border.style.strokeDashoffset = border.getAttribute("data-hideoff");
    var st = 0.25 + i * 0.22;
    tl.to(border, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, st);
    tl.fromTo(photo, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, st + 0.35);
    /* cada foto tem a sua linha de legenda: própria, ou a sua palavra na
       legenda compartilhada do trio. as duas entram junto com a foto. */
    var cap = items[i].querySelector(".pf-cap") || words[shared++];
    if (cap) tl.fromTo(cap, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, st + 0.55);
  }
}

function prepPessoal() {
  if (pessoalPrepped) return;
  var items = document.querySelectorAll(".pf-item");
  if (!items.length) return;
  pessoalPrepped = true;
  for (var i = 0; i < items.length; i++) {
    var border = items[i].querySelector(".pf-border");
    border.setAttribute("d", hwWobbleRect(302, 374, 14, 3 + i * 7, 4));
    setDrawHidden(border, 3);
  }
}

    HW.scene("pessoal", {
      prep: function () {
        prepPessoal();
      },
      fire: firePessoalTimeline
    });
  </script>
</template>
