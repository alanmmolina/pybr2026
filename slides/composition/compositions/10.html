<template>
  <div data-composition-id="anatomy" data-width="1920" data-height="1080" data-duration="10" style="position:absolute; inset:0; overflow:hidden; background:#0F0F0F;">
    <div class="slide-inner">
      <h1 class="headline" data-anim="">Conceitos fundamentais</h1>
      <div class="anat">
        <div class="anat-pipe">
          <svg class="anat-pipe-frame" aria-hidden="true"></svg>
          <div class="anat-pipe-tag"><span class="mk">dlt</span>.pipeline</div>
          <div class="anat-desc">o orquestrador: extrai, normaliza, carrega</div>
          <div class="anat-pipe-state"><span class="mk">dlt</span>.state</div>
          <div class="anat-loop-lbl">metadados persistidos entre execuções</div>

          <div class="anat-node source">
            <svg class="anat-frame" aria-hidden="true"></svg>
            <div class="anat-tag"><span class="mk">@dlt</span>.source</div>
            <div class="anat-desc">encapsula lógica de autenticação<br>e configuração compartilhada</div>
            <div class="anat-res" style="top: 130px;">
              <svg class="anat-res-frame" aria-hidden="true"></svg>
              <span class="anat-code"><span class="mk">@dlt</span>.resource</span>
              <div class="anat-desc">o gerador: a unidade<br>fundamental de extração</div>
            </div>
            <div class="anat-res transformer" style="top: 300px;">
              <svg class="anat-res-frame" aria-hidden="true"></svg>
              <span class="anat-code"><span class="mk">@dlt</span>.transformer</span>
              <div class="anat-desc">recebe dados de outro resource</div>
              <div class="anat-nested">
                <svg class="anat-nested-frame" aria-hidden="true"></svg>
                <span class="anat-code"><span class="mk">@dlt</span>.resource</span>
              </div>
            </div>
          </div>

          <svg class="anat-arrow" aria-hidden="true"></svg>
          <div class="anat-run">.run()</div>
          <div class="anat-desc anat-run-desc">executa o pipeline, movendo<br>dados da fonte para o destino</div>

          <div class="anat-node dest">
            <svg class="anat-frame" aria-hidden="true"></svg>
            <div class="anat-tag"><span class="mk">@dlt</span>.destination</div>
            <div class="anat-desc">gerencia DDL no dialeto do destino,<br>mapeamento de tipos, staging de dados e<br>evolução de schema</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var anatomyPrepped = false;
function fireAnatomy() {
  var scene = document.getElementById("scene-anatomy");
  if (!scene) return;
  var pipeFrame = scene.querySelector(".anat-pipe-frame path");
  var nodeFrames = scene.querySelectorAll(".anat-node .anat-frame path");
  var resFrames = scene.querySelectorAll(".anat-res-frame path");
  var nestedFrames = scene.querySelectorAll(".anat-nested-frame path");
  var arrowBodies = scene.querySelectorAll(".anat-arrow .flow-dash");
  var arrowHeads = scene.querySelectorAll(".anat-arrow .flow-head");
  var tags = scene.querySelectorAll(".anat-tag, .anat-pipe-tag");
  var resChips = scene.querySelectorAll(".anat-res");
  var nestedChips = scene.querySelectorAll(".anat-nested");
  var runLabel = scene.querySelector(".anat-run");
  var stateLabel = scene.querySelector(".anat-pipe-state");
  var loopLbl = scene.querySelector(".anat-loop-lbl");
  var descs = scene.querySelectorAll(".anat-desc");
  var pipeDesc = scene.querySelector(".anat-pipe > .anat-desc");
  var sourceDesc = scene.querySelector(".anat-node.source > .anat-desc");
  var destDesc = scene.querySelector(".anat-node.dest > .anat-desc");
  var resDescs = scene.querySelectorAll(".anat-res > .anat-desc");
  var runDesc = scene.querySelector(".anat-run-desc");

  function hide(el) { el.style.strokeDashoffset = el.getAttribute("data-hideoff"); }
  hide(pipeFrame);
  for (var i = 0; i < nodeFrames.length; i++) hide(nodeFrames[i]);
  for (var j = 0; j < resFrames.length; j++) hide(resFrames[j]);
  for (var k = 0; k < nestedFrames.length; k++) hide(nestedFrames[k]);
  gsap.set(arrowBodies, { opacity: 0, strokeDashoffset: 0 });
  gsap.set(arrowHeads, { opacity: 0 });

  var tl = gsap.timeline();
  gsap.set(tags, { opacity: 0 });
  gsap.set(resChips, { opacity: 0, y: 14 });
  gsap.set(nestedChips, { opacity: 0, y: 10 });
  gsap.set(runLabel, { opacity: 0 });
  gsap.set(stateLabel, { opacity: 0 });
  gsap.set(loopLbl, { opacity: 0 });
  gsap.set(descs, { opacity: 0 });

  tl.to(pipeFrame, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.1);
  tl.to(scene.querySelector(".anat-pipe-tag"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.4);
  tl.to(scene.querySelector(".anat-pipe-state"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55);
  tl.to(loopLbl, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.7);
  tl.to(scene.querySelector(".anat-node.source .anat-frame path"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.6);
  tl.to(scene.querySelector(".anat-node.source .anat-tag"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75);
  tl.to(resFrames, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.15 }, 0.9);
  tl.to(resChips, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.15 }, 0.95);
  tl.to(nestedFrames, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.3);
  tl.to(nestedChips, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.35);
  /* o .run() vira seta de fluxo: corpo tracejado que marcha, ponta sólida */
  tl.to(arrowBodies, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.5);
  tl.to(arrowHeads, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.5);
  hwFlowMarch(arrowBodies);
  tl.to(runLabel, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.7);
  tl.to(scene.querySelector(".anat-node.dest .anat-frame path"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.7);
  tl.to(scene.querySelector(".anat-node.dest .anat-tag"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.85);
  tl.to(pipeDesc, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.85);
  tl.to(sourceDesc, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.95);
  tl.to(resDescs, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.25 }, 1.1);
  tl.to(destDesc, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.0);
  tl.to(runDesc, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.9);
}

function prepAnatomy() {
  if (anatomyPrepped) return;
  var scene = document.getElementById("scene-anatomy");
  if (!scene) return;
  anatomyPrepped = true;
  var SVGN = "http://www.w3.org/2000/svg";

  var pipe = scene.querySelector(".anat-pipe");
  var pw = pipe.offsetWidth, ph = pipe.offsetHeight;
  var pfsvg = scene.querySelector(".anat-pipe-frame");
  pfsvg.setAttribute("viewBox", "0 0 " + pw + " " + ph);
  makeStrokedPath(pfsvg, hwWobbleRect(pw, ph, 14, 11, 4), 3, "#B7FF06");

  var nodes = scene.querySelectorAll(".anat-node");
  for (var n = 0; n < nodes.length; n++) {
    var w = nodes[n].offsetWidth, h = nodes[n].offsetHeight;
    var fsvg = nodes[n].querySelector(".anat-frame");
    fsvg.setAttribute("viewBox", "0 0 " + w + " " + h);
    makeStrokedPath(fsvg, hwWobbleRect(w, h, 12, 30 + n * 13, 3.5), 3, "#57c1d4");
  }

  var res = scene.querySelectorAll(".anat-res");
  for (var r = 0; r < res.length; r++) {
    var rw = res[r].offsetWidth, rh = res[r].offsetHeight;
    var rfsvg = res[r].querySelector(".anat-res-frame");
    rfsvg.setAttribute("viewBox", "0 0 " + rw + " " + rh);
    makeStrokedPath(rfsvg, hwWobbleRect(rw, rh, 12, 60 + r * 9, 3), 2.5, "#4c4c55");
  }

  var nested = scene.querySelectorAll(".anat-nested-frame");
  for (var nn = 0; nn < nested.length; nn++) {
    var nw = nested[nn].parentNode.offsetWidth, nh = nested[nn].parentNode.offsetHeight;
    nested[nn].setAttribute("viewBox", "0 0 " + nw + " " + nh);
    makeStrokedPath(nested[nn], hwWobbleRect(nw, nh, 12, 90 + nn * 11, 3), 2.5, "#4c4c55");
  }

  /* a seta ocupa exatamente o vão entre as duas caixas, com HW_ARROW_GAP de
     folga para cada lado. com left/width fixos no CSS ela ficava com 6.7px de
     um lado e 4.2 do outro — as caixas não encostam exatamente na borda do svg. */
  var arr = scene.querySelector(".anat-arrow");
  var pipe = scene.querySelector(".anat-pipe");
  var srcN = scene.querySelector(".anat-node.source");
  var destN = scene.querySelector(".anat-node.dest");
  if (arr && pipe && srcN && destN) {
    var pr = pipe.getBoundingClientRect();
    var s = srcN.getBoundingClientRect(), d = destN.getBoundingClientRect();
    var ax1 = s.right - pr.left + HW_ARROW_GAP;
    var ax2 = d.left - pr.left - HW_ARROW_GAP;
    var aw2 = Math.max(40, ax2 - ax1);
    arr.style.left = ax1 + "px";
    arr.style.width = aw2 + "px";
    arr.setAttribute("viewBox", "0 0 " + aw2 + " 60");
    hwFlowArrow(arr, 0, 30, aw2, 45, "#B7FF06");
  }
}

    HW.scene("anatomy", {
      prep: function () {
        prepAnatomy();
      },
      fire: fireAnatomy
    });
  </script>
</template>
