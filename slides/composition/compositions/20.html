          <div class="erd-box" data-ent="tags">

  <script>
    var realExamplePrepped = false;

    /* cotovelo ortogonal com canto arredondado — grammar do tipo database-schema */
    function hwElbow(x1, y1, x2, y2, xm, r) {
      r = r || 8;
      if (Math.abs(y2 - y1) < 1) return "M " + x1 + " " + y1 + " L " + x2 + " " + y2;
      var s = y2 > y1 ? 1 : -1;
      var a = xm > x1 ? 1 : -1;
      var b = x2 > xm ? 1 : -1;
      r = Math.min(r, Math.abs(xm - x1) || 8, Math.abs(xm - x2) || 8, Math.abs(y2 - y1) / 2);
      var d = "M " + x1 + " " + y1;
      d += " L " + (xm - a * r) + " " + y1;
      d += " Q " + xm + " " + y1 + " " + xm + " " + (y1 + s * r);
      d += " L " + xm + " " + (y2 - s * r);
      d += " Q " + xm + " " + y2 + " " + (xm + b * r) + " " + y2;
      d += " L " + x2 + " " + y2;
      return d;
    }

    function prepRealExample() {
      if (realExamplePrepped) return;
      var scene = document.getElementById("scene-real-example");
      if (!scene) return;
      realExamplePrepped = true;
      var SVGN = "http://www.w3.org/2000/svg";

      var host = scene.querySelector(".erd-full");
      var wires = scene.querySelector(".erd-wires");
      if (!host || !wires) return;
      wires.setAttribute("viewBox", "0 0 " + host.offsetWidth + " " + host.offsetHeight);

      /* âncora = centro vertical da LINHA da coluna, não da caixa.
         Medido por getBoundingClientRect, não offsetLeft/offsetTop: estes
         seguem o offsetParent e deslocam as caixas internas. */
      var HB = host.getBoundingClientRect();
      function A(ent, key) {
        var box = host.querySelector('[data-ent="' + ent + '"]');
        if (!box) return null;
        var bb = box.getBoundingClientRect();
        var row = key ? box.querySelector('[data-key="' + key + '"]') : null;
        var cy;
        if (row) {
          var rb = row.getBoundingClientRect();
          cy = rb.top + rb.height / 2 - HB.top;
        } else {
          cy = bb.top - HB.top + bb.height / 2;
        }
        return {
          l: bb.left - HB.left,
          r: bb.right - HB.left,
          t: bb.top - HB.top,
          b: bb.bottom - HB.top,
          cy: cy,
          cx: (bb.left + bb.right) / 2 - HB.left
        };
      }

      function wire(d, color, sw) {
        var p = document.createElementNS(SVGN, "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", color);
        p.setAttribute("stroke-width", sw);
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("stroke-linejoin", "round");
        wires.appendChild(p);
        return p;
      }

      var PURPLE = "#B392F0", AMBER = "#dba642", GRAY = "#5a5a62";
      var kids = ["genres", "parent_platforms", "platforms", "ratings", "short_screenshots", "stores", "tags"];
      var games = A("games", "dlt_id");
      var gamesLoad = A("games", "load_id");
      var loads = A("loads", "load_id");
      var stateLoad = A("state", "load_id");
      var versionHash = A("version", "version_hash");
      var loadsHash = A("loads", "schema_version_hash");

      /* linhagem: games._dlt_load_id → _dlt_loads.load_id */
      if (gamesLoad && loads) {
        wire(hwElbow(gamesLoad.l, gamesLoad.cy, loads.r, loads.cy, (gamesLoad.l + loads.r) / 2, 8), AMBER, 1.4);
      }
      /* linhagem: _dlt_pipeline_state._dlt_load_id → _dlt_loads.load_id
         (pela calha esquerda — ir direto à borda direita atravessava as caixas) */
      if (stateLoad && loads) {
        var laneL = Math.min(stateLoad.l, loads.l) - 20;
        wire(hwElbow(stateLoad.l, stateLoad.cy, loads.l, loads.cy + 10, laneL, 8), AMBER, 1.4);
      }
      /* versão do schema: _dlt_loads.schema_version_hash → _dlt_version.version_hash */
      if (versionHash && loadsHash) {
        var lane = versionHash.l - 20;
        var d = "M " + versionHash.l + " " + versionHash.cy +
                " L " + (lane + 8) + " " + versionHash.cy +
                " Q " + lane + " " + versionHash.cy + " " + lane + " " + (versionHash.cy + 8) +
                " L " + lane + " " + (loadsHash.cy - 8) +
                " Q " + lane + " " + loadsHash.cy + " " + (lane + 8) + " " + loadsHash.cy +
                " L " + loadsHash.l + " " + loadsHash.cy;
        wire(d, GRAY, 1.2);
      }
      /* normalização: games._dlt_id → espinha → _dlt_parent_id de cada filha */
      if (games) {
        var kidsA = [];
        for (var i = 0; i < kids.length; i++) {
          var ka = A(kids[i], "parent_id");
          if (ka) kidsA.push(ka);
        }
        if (kidsA.length) {
          var xs = kidsA[0].l - 40;   /* espinha encostada nas filhas: o vão da esquerda fica livre p/ o rótulo */
          wire(hwElbow(games.r, games.cy, xs, games.cy, xs, 0), PURPLE, 1.4);
          wire("M " + xs + " " + kidsA[0].cy + " L " + xs + " " + kidsA[kidsA.length - 1].cy, PURPLE, 1.4);
          for (var k = 0; k < kidsA.length; k++) {
            wire("M " + xs + " " + kidsA[k].cy + " L " + kidsA[k].l + " " + kidsA[k].cy, PURPLE, 1.4);
          }
        }
      }

      /* rótulos das relações — máscara opaca, folga da linha */
      function label(text, x, y, mode) {
        var d = document.createElement("div");
        d.className = "erd-link-label";
        d.innerHTML = text;
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.style.transform = mode === "below" ? "translate(-50%, 0)" : "translate(-50%, -100%)";
        host.appendChild(d);
        return d;
      }
      if (gamesLoad && loads) {
        label('<span class="mono">_dlt_load_id</span><span class="to">aponta para</span><span class="mono">_dlt_loads.load_id</span><span class="val">1790731675.145563</span>',
              (gamesLoad.l + loads.r) / 2, gamesLoad.cy - 22, "above");
      }
      if (games) {
        var kidsFirst = A(kids[0], "parent_id");
        if (kidsFirst) {
          label('<span class="mono">_dlt_parent_id</span><span class="to">aponta para</span><span class="mono">games._dlt_id</span>',
                (games.r + (kidsFirst.l - 40)) / 2, games.cy + 14, "below");
        }
      }

    }

    function fireRealExample() {
      var scene = document.getElementById("scene-real-example");
      if (!scene) return;
      var host = scene.querySelector(".erd-full");
      if (!host) return;

      var boxes = host.querySelectorAll(".erd-box");
      var wires = host.querySelectorAll(".erd-wires path");
      var labels = host.querySelectorAll(".erd-link-label");
      var group = host.querySelector(".erd-group");
      var groupTag = host.querySelector(".erd-group-tag");

      for (var w = 0; w < wires.length; w++) {
        var len = wires[w].getTotalLength();
        wires[w].style.strokeDasharray = len + " " + len;
        wires[w].style.strokeDashoffset = len;
        wires[w].setAttribute("data-hideoff", len);
      }

      gsap.set(boxes, { opacity: 0, y: 12 });
      gsap.set(labels, { opacity: 0 });
      if (group) gsap.set(group, { opacity: 0 });
      if (groupTag) gsap.set(groupTag, { opacity: 0 });

      var tl = gsap.timeline();
      if (group) tl.to(group, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      if (groupTag) tl.to(groupTag, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.15);
      tl.to(boxes, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out", stagger: 0.055 }, 0.1);
      tl.to(wires, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut", stagger: 0.05 }, 0.55);
      tl.to(labels, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.08 }, 1.0);
    }

    HW.scene("real-example", {
      prep: function () {
        prepRealExample();
      },
      fire: fireRealExample
    });
  </script>
