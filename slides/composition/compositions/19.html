  <script>
    var pipelineFlowPrepped = false;
function firePipeline() {
  var scene = document.getElementById("scene-pipeline");
  if (!scene) return;
  var trigBox = scene.querySelector(".trig-box");
  var trigSides = scene.querySelectorAll(".trig-side");
  var endFrames = scene.querySelectorAll(".flow-end .ra-box-frame path");
  var flowSvg = scene.querySelectorAll(".trig-flow");
  var flowDash = scene.querySelectorAll(".flow-dash");
  var stations = scene.querySelectorAll(".flow-station");
  var arrs = scene.querySelectorAll(".flow-arr path");

  var tl = gsap.timeline();
  gsap.set(trigBox, { opacity: 0, y: 16 });
  gsap.set(trigSides, { opacity: 0, y: 16 });
  gsap.set(flowSvg, { opacity: 0 });
  gsap.set(stations, { opacity: 0, y: 18 });
  gsap.set(arrs, { opacity: 0, y: 18 });

  /* 1) o código primeiro */
  tl.to(trigBox, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", overwrite: "auto" }, 0);
  /* 2) as pontas RAWG/DuckDB (moldura sloppy se desenhando) e o conector de fluxo */
  tl.to(trigSides, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.1, overwrite: "auto" }, 0.18);
  tl.to(endFrames, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.1, overwrite: "auto" }, 0.22);
  tl.to(flowSvg, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.08, overwrite: "auto" }, 0.3);
  /* 3) steps da esquerda para a direita — cada seta acompanha o movimento
        da estação que ela liga (slide + draw-in juntos) */
  tl.to(stations[0], { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" }, 0.5);
  tl.to(arrs[0], { opacity: 1, y: 0, strokeDashoffset: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" }, 0.66);
  tl.to(stations[1], { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" }, 0.66);
  tl.to(arrs[1], { opacity: 1, y: 0, strokeDashoffset: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" }, 0.82);
  tl.to(stations[2], { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" }, 0.82);

  /* o dado segue fluindo: tracejado marchando nos conectores */
  if (flowDash.length) {
    gsap.to(flowDash, { strokeDashoffset: "-=20", duration: 1.1, repeat: -1, ease: "none" });
  }
}

function prepPipelineFlow() {
  if (pipelineFlowPrepped) return;
  var scene = document.getElementById("scene-pipeline");
  if (!scene) return;
  pipelineFlowPrepped = true;
  var SVGN = "http://www.w3.org/2000/svg";

  var arrs = scene.querySelectorAll(".flow-arr");
  for (var a = 0; a < arrs.length; a++) {
    var aw = Math.round(arrs[a].getBoundingClientRect().width);
    arrs[a].setAttribute("viewBox", "0 0 " + aw + " 36");
    makeStrokedPath(arrs[a], hwConnector(HW_ARROW_GAP, 18, aw - HW_ARROW_GAP, 30 + a * 13), 4, "#B7FF06");
  }

  /* molduras sloppy nas caixas das pontas (RAWG / DuckDB) */
  var ends = scene.querySelectorAll(".flow-end");
  for (var e = 0; e < ends.length; e++) {
    var ew = ends[e].offsetWidth, eh = ends[e].offsetHeight;
    var efsvg = document.createElementNS(SVGN, "svg");
    efsvg.setAttribute("class", "ra-box-frame");
    efsvg.setAttribute("viewBox", "0 0 " + ew + " " + eh);
    efsvg.setAttribute("aria-hidden", "true");
    makeStrokedPath(efsvg, hwWobbleRect(ew, eh, 12, 40 + e * 23, 3), 3, "#727272");
    ends[e].appendChild(efsvg);
  }

  /* conectores de fluxo entre RAWG → código → DuckDB: linha tracejada que
     marcha continuamente + ponteiro sólido na ponta (direção do dado) —
     verde do dlt porque é o dlt quem faz o dado fluir */
  var flows = scene.querySelectorAll(".trig-flow");
  for (var f = 0; f < flows.length; f++) {
    var fw = 84, fy = 18;
    flows[f].setAttribute("viewBox", "0 0 " + fw + " 36");
    /* mesmo hwFlowArrow da faixa de baixo: corpo tracejado + ponta canônica,
       com HW_ARROW_GAP de folga para cada lado. */
    hwFlowArrow(flows[f], HW_ARROW_GAP, fy, fw - HW_ARROW_GAP, 70 + f * 9, "#B7FF06");
  }
}

    HW.scene("pipeline", {
      prep: function () {
        prepPipelineFlow();
      },
      fire: firePipeline
    });
  </script>
