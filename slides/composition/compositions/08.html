  <script>
    var dltIntroPrepped = false;
function fireDltIntro() {
  var scene = document.getElementById("scene-what-is-dlt");
  if (!scene) return;
  var frames = scene.querySelectorAll(".dlt-num-frame path");
  var noteFrames = scene.querySelectorAll(".dlt-card-frame path");
  var axes = scene.querySelectorAll(".dlt-plot path:not(.dlt-line):not(.dlt-point):not(.dlt-star)");
  var line = scene.querySelector(".dlt-plot path.dlt-line");
  var points = scene.querySelectorAll(".dlt-point");
  var ticks = scene.querySelectorAll(".dlt-tick");
  var star = scene.querySelector(".dlt-star");

  function hide(p) { for (var i = 0; i < p.length; i++) p[i].style.strokeDashoffset = p[i].getAttribute("data-hideoff"); }
  hide(frames);
  hide(noteFrames);
  hide(axes);
  if (line) line.style.strokeDashoffset = line.getAttribute("data-hideoff");
  gsap.set(points, { opacity: 0 });
  gsap.set(ticks, { opacity: 0 });
  gsap.set(scene.querySelector(".dlt-legend"), { opacity: 0 });
  if (star) gsap.set(star, { opacity: 0, scale: 0 });

  var tl = gsap.timeline();
  /* da esquerda para a direita: as três notas primeiro, depois os números
     grandes à direita, e só então o gráfico que os explica. */
  tl.to(noteFrames, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.1 }, 0.1);
  tl.to(frames, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.12 }, 0.5);
  tl.to(axes, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.05 }, 0.85);
  tl.to(ticks, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.03 }, 1.05);
  if (star) tl.to(star, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.05);
  if (line) tl.to(line, { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 1.2);
  tl.to(points, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.022 }, 1.3);
  tl.to(scene.querySelector(".dlt-legend"), { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.5);
}

function prepDltIntro() {
  if (dltIntroPrepped) return;
  var scene = document.getElementById("scene-what-is-dlt");
  if (!scene) return;
  var SVGN = "http://www.w3.org/2000/svg";

  var nums = scene.querySelectorAll(".dlt-num");
  for (var n = 0; n < nums.length; n++) {
    var w = nums[n].offsetWidth, h = nums[n].offsetHeight;
    var fsvg = document.createElementNS(SVGN, "svg");
    fsvg.setAttribute("class", "dlt-num-frame");
    fsvg.setAttribute("viewBox", "0 0 " + w + " " + h);
    fsvg.setAttribute("aria-hidden", "true");
    makeStrokedPath(fsvg, hwWobbleRect(w, h, 12, 40 + n * 9, 1.8), 2.5, "#727272");
    nums[n].appendChild(fsvg);
  }

  var cards = scene.querySelectorAll(".dlt-card");
  for (var nn = 0; nn < cards.length; nn++) {
    var nw = cards[nn].offsetWidth, nh = cards[nn].offsetHeight;
    var nfsvg = document.createElementNS(SVGN, "svg");
    nfsvg.setAttribute("class", "dlt-card-frame");
    nfsvg.setAttribute("viewBox", "0 0 " + nw + " " + nh);
    nfsvg.setAttribute("aria-hidden", "true");
    makeStrokedPath(nfsvg, hwWobbleRect(nw, nh, 10, 160 + nn * 13, 3), 2.5, "#00bfa5");
    cards[nn].appendChild(nfsvg);
  }

  var plotBox = scene.querySelector(".dlt-plot-box");
  var cw = plotBox.offsetWidth, ch = plotBox.offsetHeight;

  var plot = plotBox.querySelector(".dlt-plot");
  plot.setAttribute("viewBox", "0 0 " + cw + " " + ch);

  var STARS = [11,12,12,15,18,24,27,31,35,54,61,79,98,197,305,406,673,850,938,1035,1397,1545,1669,1778,1896,2027,2181,2321,2469,2672,2800,2963,3177,3309,3478,3606,3740,3885,4004,4143,4300,4567,4687,4805,4924,5119,5233,5391,5528,5664,5802,5847];
  var DOTS = [[0, 11], [6, 27], [12, 98], [18, 938], [24, 1896], [30, 2800], [36, 3740], [42, 4687], [48, 5528], [51, 5847]];
  var N_MONTHS = STARS.length - 1;
  var YEARS = [["2022", 0], ["2023", 7], ["2024", 19], ["2025", 31], ["2026", 43]];
  var YTICKS = [0, 1000, 2000, 3000, 4000, 5000, 6000];
  var YMAX = 6000;

  var padL = 92, padR = 36, padT = 44, padB = 76;
  var pw = cw - padL - padR, ph = ch - padT - padB;
  function xAt(m) { return padL + (m / N_MONTHS) * pw; }
  function yAt(v) { return padT + (1 - v / YMAX) * ph; }

  makeStrokedPath(plot, hwWobblePoly([[padL, padT], [padL, padT + ph]], 10, 3), 2, "#727272");
  makeStrokedPath(plot, hwWobblePoly([[padL, padT + ph], [padL + pw, padT + ph]], 11, 3), 2, "#727272");

  for (var t = 0; t < YTICKS.length; t++) {
    var ty = yAt(YTICKS[t]);
    makeStrokedPath(plot, hwWobblePoly([[padL - 8, ty], [padL, ty]], 20 + t, 1.5), 1.5, "#727272");
    addPlotText(plot, padL - 16, ty + 9, fmtK(YTICKS[t]), "end");
  }

  for (var y = 0; y < YEARS.length; y++) {
    var yr = YEARS[y];
    var yx = xAt(yr[1]);
    makeStrokedPath(plot, hwWobblePoly([[yx, padT + ph], [yx, padT + ph + 8]], 30 + y, 1.5), 1.5, "#727272");
    addPlotText(plot, yx, padT + ph + 46, yr[0], "middle");
  }

  var star = makeFilledPath(plot, hwStar(padL, padT - 18, 13, 5.5, 300, 1.5), "#dba642");
  star.setAttribute("class", "dlt-star");

  var pts = [];
  for (var p = 0; p < STARS.length; p++) pts.push([xAt(p), yAt(STARS[p])]);
  var linePath = makeStrokedPath(plot, hwSmoothPath(pts, 5, 2.5), 4, "#B7FF06");
  linePath.setAttribute("class", "dlt-line");

  for (var d = 0; d < DOTS.length; d++) {
    var dot = makeFilledPath(plot, hwWobbleCircle(xAt(DOTS[d][0]), yAt(DOTS[d][1]), 6, 100 + d, 1.2, 10), "#B7FF06");
    dot.setAttribute("class", "dlt-point");
    dot.setAttribute("data-idx", d);
  }

  dltIntroPrepped = true;
}

    HW.scene("what-is-dlt", {
      prep: function () {
        prepDltIntro();
      },
      fire: fireDltIntro
    });
  </script>
