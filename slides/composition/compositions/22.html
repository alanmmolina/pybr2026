<script>
    var closingPrepped = false;
function prepClosingStack() {
      if (closingPrepped) return;
      var scene = document.getElementById("scene-closing");
      if (!scene) return;
      closingPrepped = true;
var conns = scene.querySelectorAll(".pmap-conn");
      for (var c = 0; c < conns.length; c++) {
        var x1 = parseFloat(conns[c].getAttribute("data-x1"));
        var y = parseFloat(conns[c].getAttribute("data-y"));
        var x2 = parseFloat(conns[c].getAttribute("data-x2"));
        /* hwFlowArrow; x1/x2 do markup marcam a borda da caixa */
        var flecha = hwFlowArrow(conns[c], x1 + HW_ARROW_GAP, y, x2 - HW_ARROW_GAP, 7 + c * 5, "#B7FF06");
        flecha.body.setAttribute("mask", "url(#" + revelaTracejado(conns[c], flecha.body.getAttribute("d"), 14) + ")");
        /* o hwFlowArrow apaga o draw-in da ponta; devolve aqui */
        setDrawHidden(flecha.head, 4);
      }
/* a branch: armazenamento -> consumo, por baixo da transformação. x1/x2 nos centros das caixas (420+180 e 1340+180). */
      var bypass = scene.querySelector(".bypass");
      if (bypass) {
        var svg = bypass.querySelector(".bypass-arc");
        var bw = bypass.offsetWidth, bh = bypass.offsetHeight;
        svg.setAttribute("viewBox", "0 0 " + bw + " " + bh);
        var y0 = 0, y1 = bh - 34, x1 = 600, x2 = 1520;
        /* o corpo termina 13px antes da ponta, como nas 3 setas diretas */
        var d = "M " + x1 + " " + y0
              + " L " + x1 + " " + (y1 - 22)
              + " Q " + x1 + " " + y1 + " " + (x1 + 22) + " " + y1
              + " L " + (x2 - 22) + " " + y1
              + " Q " + x2 + " " + y1 + " " + x2 + " " + (y1 - 22)
              + " L " + x2 + " " + (y0 + 15);
        var corpo = document.createElementNS("http://www.w3.org/2000/svg", "path");
        corpo.setAttribute("class", "bypass-flow flow-dash");
        corpo.setAttribute("d", d);
        corpo.style.strokeDasharray = "8 12";
        corpo.style.strokeDashoffset = "0";
        corpo.setAttribute("mask", "url(#" + revelaTracejado(svg, d, 24, "bypass-reveal") + ")");
        svg.appendChild(corpo);
        /* ponta canônica (17×±10), rotacionada para cima */
        var hd = makeStrokedPath(svg,
          "M " + x2 + " " + (y0 + 2) + " L " + (x2 - 10) + " " + (y0 + 19) +
          " M " + x2 + " " + (y0 + 2) + " L " + (x2 + 10) + " " + (y0 + 19), 4, "#B7FF06");
        hd.setAttribute("class", "bypass-head");
      }
/* envelope da orquestração: mesmo quadrado sloppy cinza dos estágios */
      var orch = scene.querySelector(".orch-layer");
      if (orch) {
        var f = orch.querySelector(".orch-frame");
        var w = orch.offsetWidth, h = orch.offsetHeight;
        f.setAttribute("viewBox", "0 0 " + w + " " + h);
        makeStrokedPath(f, hwWobbleRect(w, h, 10, 61, 3), 2.5, "#4c4c55");
      }
/* molduras sloppy das caixas grandes — o herói em lima, o resto branco */
      var nodes = scene.querySelectorAll(".pmap-node");
      for (var n = 0; n < nodes.length; n++) {
        var node = nodes[n];
        var w2 = node.offsetWidth, h2 = node.offsetHeight;
        var svg2 = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg2.setAttribute("class", "pmap-frame");
        svg2.setAttribute("viewBox", "0 0 " + w2 + " " + h2);
        svg2.setAttribute("aria-hidden", "true");
        var hero = node.classList.contains("hl");
        var b = document.createElementNS("http://www.w3.org/2000/svg", "path");
        b.setAttribute("d", hwWobbleRect(w2, h2, 10, 40 + n * 9, 3));
        b.setAttribute("fill", "none");
        b.setAttribute("stroke", hero ? "#B7FF06" : "#4c4c55");
        b.setAttribute("stroke-width", hero ? "4" : "2.5");
        b.setAttribute("stroke-linecap", "round");
        b.setAttribute("stroke-linejoin", "round");
        setDrawHidden(b, hero ? 4 : 2.5);
        svg2.appendChild(b);
        node.appendChild(svg2);
      }
/* molduras sloppy das células — o idioma do slide 18 */
      var cells = scene.querySelectorAll(".cell");
      for (var c2 = 0; c2 < cells.length; c2++) {
        var cellEl = cells[c2];
        var cw = cellEl.offsetWidth, chh = cellEl.offsetHeight;
        /* a cor do ladrilho, lida do inline style antes do fire apagá-la */
        cellEl.setAttribute("data-bg", getComputedStyle(cellEl).backgroundColor);
        var lsvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        lsvg.setAttribute("class", "logo-cell-frame");
        lsvg.setAttribute("viewBox", "0 0 " + cw + " " + chh);
        lsvg.setAttribute("aria-hidden", "true");
        var lp = document.createElementNS("http://www.w3.org/2000/svg", "path");
        lp.setAttribute("d", hwWobbleRect(cw, chh, 8, 200 + c2 * 11, 3));
        lp.setAttribute("fill", "none");
        var heroCell = cellEl.classList.contains("cell-hero");
        if (heroCell) continue;   /* sem fundo nem moldura: só a marca dlt */
        lp.setAttribute("stroke", "#fafafa");
        lp.setAttribute("stroke-width", "2.5");
        lp.setAttribute("stroke-linecap", "round");
        lp.setAttribute("stroke-linejoin", "round");
        setDrawHidden(lp, 2.5);
        lsvg.appendChild(lp);
        cellEl.appendChild(lsvg);
      }
    }
function fireClosingStack() {
      var scene = document.getElementById("scene-closing");
      if (!scene) return;
      var frames = scene.querySelectorAll(".pmap-frame path");
      var orchFramePath = scene.querySelector(".orch-frame path");
      var cellFrames = scene.querySelectorAll(".logo-cell-frame path");
      var cells = scene.querySelectorAll(".cell");
      var nodes = scene.querySelectorAll(".pmap-node");
      /* só as setas entre estágios: a branch também é .flow-dash */
      var lines = scene.querySelectorAll(".pmap-conn .flow-dash");
      var heads = scene.querySelectorAll(".pmap-conn .flow-head");
      var reveals = scene.querySelectorAll(".pmap-conn .flow-reveal");
      var bFlow = scene.querySelector(".bypass-flow");
      var bHead = scene.querySelector(".bypass-head");
      var bRev = scene.querySelector(".bypass-reveal");
      var caps = scene.querySelectorAll(".stage-cap, .orch-cap");

      var alvos = [];
      function addAll(list) {
        if (!list) return;
        if (list.nodeType) { alvos.push(list); return; }
        for (var k = 0; k < list.length; k++) if (list[k]) alvos.push(list[k]);
      }
      addAll(frames); addAll(orchFramePath); addAll(cellFrames); addAll(cells);
      addAll(lines); addAll(heads); addAll(reveals); addAll(bFlow); addAll(bHead); addAll(bRev);
      addAll(caps);
      if (alvos.length) gsap.killTweensOf(alvos);

      function hide(p) {
        if (!p) return;
        p.style.strokeDashoffset = p.getAttribute("data-hideoff");
      }
      for (var f = 0; f < frames.length; f++) hide(frames[f]);
      hide(orchFramePath);
      for (var cf = 0; cf < cellFrames.length; cf++) hide(cellFrames[cf]);

      /* caixas e envelope NÃO levam fade: fundo transparente, então a entrada deles é o próprio traço se desenhando */
      gsap.set(caps, { opacity: 0 });
      gsap.set(heads, { opacity: 0, y: 10 });
      gsap.set(lines, { strokeDashoffset: 0 });
      /* os corpos não dão fade: cada máscara nasce recolhida e revela o traço */
      for (var rv2 = 0; rv2 < reveals.length; rv2++) {
        gsap.set(reveals[rv2], { strokeDashoffset: reveals[rv2].getAttribute("data-hideoff") });
      }
      /* a branch não dá fade: o corpo já nasce visível e é a máscara que o revela. a ponta se desenha no fim do traço. */
      if (bRev) gsap.set(bRev, { strokeDashoffset: bRev.getAttribute("data-hideoff") });
      if (bHead) gsap.set(bHead, { opacity: 0, strokeDashoffset: bHead.getAttribute("data-hideoff") || 0 });

      /* cada célula nasce sem cor e sem conteúdo; o ladrilho ganha a cor da marca enquanto o contorno se desenha */
      for (var c2 = 0; c2 < cells.length; c2++) {
        gsap.set(cells[c2], { backgroundColor: "rgba(0,0,0,0)" });
        var cont = cells[c2].querySelectorAll(".pmap-logo, .dlt-mark, .cell-n");
        if (cont.length) gsap.set(cont, { opacity: 0 });
      }

      var tl = gsap.timeline();

      /* uma batida só para a entrada inteira: a virada de palco custa o mesmo que a passagem de uma célula para a outra */
      var PASSO = 0.34;

      /* ordem em cada ladrilho: FUNDO → ÍCONE → CONTORNO → NOME. cada fase começa quando a anterior termina; as vizinhas se sobrepõem */
      function entraCelula(cel, quando) {
        var moldura = cel.querySelector(".logo-cell-frame path");
        var icone = cel.querySelectorAll(".pmap-logo, .dlt-mark");
        var nome = cel.querySelector(".cell-n");
        tl.to(cel, { backgroundColor: cel.getAttribute("data-bg") || "rgba(0,0,0,0)", duration: 0.18, ease: "power2.out" }, quando);
        if (icone.length) tl.to(icone, { opacity: 1, duration: 0.18, ease: "power2.out" }, quando + 0.15);
        if (moldura) tl.to(moldura, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, quando + 0.32);
        if (nome) tl.to(nome, { opacity: 1, duration: 0.18, ease: "power2.out" }, quando + 0.62);
      }

      /* 1. o envelope da orquestração se desenha, e as células desfilam */
      var t = 0;
      if (orchFramePath) tl.to(orchFramePath, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0);
      t = 0.1;
      var orchCells = scene.querySelectorAll(".orch-cells .cell");
      for (var oc = 0; oc < orchCells.length; oc++) { entraCelula(orchCells[oc], t); t += PASSO; }
      var orchCap = scene.querySelector(".orch-cap");
      if (orchCap) tl.to(orchCap, { opacity: 1, duration: 0.28, ease: "power2.out" }, t - PASSO);

      /* 2. cada estágio: seta entrega a caixa, palco se desenha, células e legenda. seta e palco entram ANTES do fim da célula anterior. */
      var grupos = [[], [], [], []];
      for (var ni = 0; ni < nodes.length; ni++) {
        var cs = nodes[ni].querySelectorAll(".cell");
        for (var q = 0; q < cs.length; q++) grupos[ni].push(cs[q]);
      }
      var stageCaps = scene.querySelectorAll(".stage-cap");
      for (var e = 0; e < nodes.length; e++) {
        if (e > 0) {
          /* a seta entra antes da primeira célula e ainda corre depois */
          if (reveals[e - 1]) tl.to(reveals[e - 1], { strokeDashoffset: 0, duration: PASSO, ease: "power2.out" }, t - PASSO * 0.7);
          if (heads[e - 1]) tl.to(heads[e - 1], { opacity: 1, y: 0, strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, t - PASSO * 0.7 + 0.26);
        }
        /* o palco desenha por cima da seta e segue durante as primeiras células */
        if (frames[e]) tl.to(frames[e], { strokeDashoffset: 0, duration: PASSO + 0.16, ease: "power2.out" }, t - PASSO * 0.35);
        for (var g2 = 0; g2 < grupos[e].length; g2++) { entraCelula(grupos[e][g2], t); t += PASSO; }
        if (stageCaps[e]) tl.to(stageCaps[e], { opacity: 1, duration: 0.28, ease: "power2.out" }, t - PASSO);
      }

      /* 3. a branch por baixo — desenhada, e começando junto da última célula */
      if (bRev) tl.to(bRev, { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" }, t - PASSO * 1.2);
      if (bHead) tl.to(bHead, { opacity: 1, strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t - PASSO * 1.2 + 0.55);

      /* o tracejado marcha: o dado fluindo, como nos slides 10/11/12 */
      if (lines.length) hwFlowMarch(lines);
      if (bFlow) hwFlowMarch([bFlow]);
    }
HW.scene("closing", {
      prep: prepClosingStack,
      fire: fireClosingStack
    });
  </script>
</template>
